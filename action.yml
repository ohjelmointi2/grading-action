name: Grade
description: Grade the assignment

inputs:
  test_suite:
    description: Path to the test suite JSON file, relative to the workspace
    required: false
    default: '.grading/config.json'

runs:
  using: composite
  steps:
    - name: Run tests and generate grading report
      id: grading
      continue-on-error: true
      run: bash "$GITHUB_ACTION_PATH/grade.sh" "$TEST_SUITE"
      shell: bash
      env:
        TEST_SUITE: ${{ inputs.test_suite }}

    - name: Update commit status
      id: update_status
      if: steps.grading.outputs.status_state != '' && steps.grading.outputs.status_description != ''
      continue-on-error: true
      run: |
        gh api \
          --method POST \
          repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA \
          -f "state=$STATUS_STATE" \
          -f "context=Autograding" \
          -f "description=$STATUS_DESCRIPTION" \
          -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      env:
        GH_TOKEN: ${{ github.token }}
        STATUS_STATE: ${{ steps.grading.outputs.status_state }}
        STATUS_DESCRIPTION: ${{ steps.grading.outputs.status_description }}
      shell: bash

    - name: Propagate result
      if: always()
      run: |
        if [[ "${{ steps.grading.outcome }}" == "failure" || "${{ steps.update_status.outcome }}" == "failure" ]]; then
          exit 1
        fi
      shell: bash
